name: Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        working-directory: mobile
        run: flutter create --platforms=android --org com.githubai --project-name tradingagents .
      - name: Validate backend Python syntax
        run: python -m py_compile backend/app.py backend/advanced.py backend/ollama_status.py
      - name: Run Ollama preflight unit tests
        run: python -m unittest discover -s backend -p 'test_ollama_status.py' -v
      - name: Resolve Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test
      - name: Build Flutter web frontend
        working-directory: mobile
        run: |
          flutter create --platforms=web .
          flutter build web --release --dart-define=TRADINGAGENTS_BACKEND_URL=https://tradingagents-backend-i0a1.onrender.com
      - name: Build debug APK
        working-directory: mobile
        run: flutter build apk --debug --dart-define=TRADINGAGENTS_BACKEND_URL=https://tradingagents-backend-i0a1.onrender.com
      - uses: actions/upload-artifact@v4
        with:
          name: ai-trading-ui-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

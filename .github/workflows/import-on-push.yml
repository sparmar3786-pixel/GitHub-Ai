name: Import TradingAgents repository

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-on-push.yml"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source repository
        run: git clone --depth 1 --branch main https://github.com/TauricResearch/TradingAgents.git /tmp/TradingAgents

      - name: Copy source files and push
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/TradingAgents/.git
          cp -a /tmp/TradingAgents/. .
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to import."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Bulk import TauricResearch/TradingAgents source files"
          git push
